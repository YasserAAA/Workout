<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Interval Timer - Offline</title>
    <link rel="stylesheet" href="style.min.css">
</head>
<body>
    <div class="container py-4">
        <div class="app-container">
            <div class="header text-center">
                <h1><i class="fas fa-dumbbell me-2"></i>Gym Interval Timer</h1>
            </div>

            <div class="row p-4">
                <div class="col text-center">
                    <div class="offline-message">
                        <i class="fas fa-wifi-slash fa-4x mb-4"></i>
                        <h2>You're offline</h2>
                        <p>This app requires an internet connection for some features.</p>
                        <p>Your saved routines are still available.</p>
                        <button class="btn btn-primary mt-3" onclick="window.history.back()">Go Back</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
